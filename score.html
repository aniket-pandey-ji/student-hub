<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Score</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Score Dashboard</h1>
    </header>

    <main class="score-container">

        <div class="score-card">
            <h2>Mathematics</h2>
            <p>Marks: <strong>85 / 100</strong></p>
            <div class="progress-bar">
                <div class="progress" style="width:85%">85%</div>
            </div>
        </div>

        <div class="score-card">
            <h2>C Programming</h2>
            <p>Marks: <strong>90 / 100</strong></p>
            <div class="progress-bar">
                <div class="progress" style="width:90%">90%</div>
            </div>
        </div>

        <div class="score-card">
            <h2>DBMS</h2>
            <p>Marks: <strong>78 / 100</strong></p>
            <div class="progress-bar">
                <div class="progress" style="width:78%">78%</div>
            </div>
        </div>

        <div class="score-card">
            <h2>Java Programming</h2>
            <p>Marks: <strong>88 / 100</strong></p>
            <div class="progress-bar">
                <div class="progress" style="width:88%">88%</div>
            </div>
        </div>

    </main>

</body>
</html>
